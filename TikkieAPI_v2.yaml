openapi: "3.0.0"
info:
  version: "2.3.3"
  title: Tikkie
  x-apiType: open
  description: |-
    # Overview
    The Tikkie API enables Tikkie business customers to create payment requests.

    This API provides the following functionality:
    - Create payment requests and retrieve transaction details.
    - List payments that have been made on a payment request.
    - Refund payments and retrieve refund details.
    - Subscribe to notifications on payments, refunds, and bundled payouts.
    - Retrieve transaction bundles.
      - **Note**: Bundled payout must be enabled in your Tikkie Business Account.
    
    ⚠️ This API cannot delete payment requests.

    ## API Key & App Token
    
    An API Key is a unique token per organisation. It is used to identify your company. The API Key can be retrieved in the ABN AMRO Developer Portal after registering your application. Follow the [Tutorial](#section/Overview/Tutorial) to learn how to obtain an API Key.
    
    An App Token is connected to your Tikkie Business account (and you can have multiple). It is possible to assign different permissions to each token.

    >**Important:** In a production environment, App Tokens are created and configured in the Tikkie Business Portal under API settings. In a Sandbox environment, an App Token is created using the API, see [Tutorial](#section/Overview/Tutorial).

    An App Token can have multiple permissions:

    | Permission | Functionality Description |
    |---|---|
    | Payment request    | Create payment requests, retrieve payment request details, retrieve payment information and execute refunds, and create subscriptions to payment request notifications. |
    | Refund             | Create refunds. Refund is an additional permission on top of payment request. |
    | Transaction bundle | Retrieve transaction bundles and subscribe to transaction notifications. |
    
    Make sure to enable each permission you need for your application in the Tikkie Business Portal. If you do not enable a permission, the API will return a `403 Forbidden` error when you try to use that functionality.
    More information on App Tokens and permissions can be found in the <a href="https://business.tikkie.me" target="_blank">Tikkie Business Portal</a> under API settings.
    
    > **Important:** The API Key and App Token must be included in the header of each request. The API Key is included in the `API-Key` header, and the App Token is included in the `X-App-Token` header.
    
    ## Thresholds

    Different thresholds apply to aspects of payment requests, such as: the number of payments per payment request, the maximum amount of a payment request, and the maximum yield.
    These thresholds are discussed on a per customer basis when access to production is requested.
    These thresholds are not applicable in the sandbox environment.

    ## Payout of transactions

    When a payment request is paid, the transaction is bundled and paid out to your bank account once a day. This is called a 'bundled payout'. How to configure your method of payout, can be found in the <a href="https://business.tikkie.me/settings/payment" target="_blank">settings</a> of your Tikkie Business Portal account.
    By default, your Tikkie transactions are bundled. To get transaction details and notifications on a bundled payout, the application must have the **transaction bundle permission**. For more information on permissions, see [App token](#section/Overview/App-token).

    For Tikkie transactions that are paid out individually and directly, the application does not have the functionality of the transaction bundle module.

    Bundle information is retrieved using the [GET Transaction Bundles](#operation/getBundleList) and [GET Transaction Bundle](#operation/getBundle) endpoints.

    ### Downloading transaction bundle files

    It is possible to download a file that contains all transactions for a specific bundle. This can be used in your bookkeeping system. We support the CAMT.053 format only.

    - Files are available for download when the bundle is paid out to your account. To receive notifications when this occurs, set up a transactions subscription using: [POST Transactions Subscription](#operation/subscribeTransactionsNotifications).
    - The full file URL is located in the `files` property of the bundle. Locate this by executing [GET Bundle](#operation/getBundle).
    - Using the obtained URL, the file can be downloaded. The following headers must be added in the request to download the file:
        - `X-App-Token`
        - `User-Agent`
        - `API-Key`
        
    > **Note:** If you receive a 'Forbidden' response, ensure all headers are present.

    # Requirements
    
    To use this API in a production environment, you must have the following:
    - <a href="https://www.tikkie.me/zakelijk" target="_blank">Visit the Tikkie website to sign up for a contract</a>.
    - An [app token](#section/Overview/App-token) created in <a href="https://business.tikkie.me" target="_blank">Tikkie business portal</a>. 
    > **Note**: This is not required if you want to use this API in the Sandbox environment.

    >**Important:** Consumer to Consumer (C2C) use of the API is prohibited.

    >**Important:** Generation of payment requests on behalf of third parties is prohibited.

    # Sandbox access

    Use the ABN AMRO Developer Sandbox to access dummy data, and safely test all functionality of an API.
    For most products, the sandbox environment is identical to production.

    To access the Tikkie API in a sandbox environment, complete the [Tutorial](#section/Tutorial).

    # Production access

    When you are ready to go live with your application, complete the following steps:

    >**Important:** To go live with your application, you must create a new application in the developer portal. A different API key is required for your production environment. This is described below:
    
    1. Log in to <a href="https://developer.abnamro.com/" target="_blank">your account</a> .
    1. In the top navigation bar, on the right, click **My Apps** icon.
    1. Click **Request Production Access**.
    1. Select the API category (Tikkie) that you want to request production access on.
     	>**Note:** It is not possible to request production access for multiple API categories in one request.
    1. Fill in the form, click **Preview** and, after reviewing your details, click **Submit**.
    1. You receive a confirmation email and ticket-ID. 
    1. ABN AMRO developer support validates the form, and if necessary contacts you. 
    1. When the setup is complete, ABN AMRO developer support contacts you, and a new app is added in **My Apps**. This new app contains your API key for your production environment.

    # Tutorial

    This tutorial describes how to connect the Tikkie API to the sandbox environment, along with the API's functionality.

    ## Postman collection

    Use the following Postman collection to try out the functionality of this API:

    - This collection highlights all available operations of the API: <a href="https://god.gw.postman.com/run-collection/21342115-4dba0883-0838-44e5-9ff1-22969c82a36c?action=collection%2ffork&collection-url=entityId%3D21342115-4dba0883-0838-44e5-9ff1-22969c82a36c%26entityType%3Dcollection%26workspaceId%3D1235b3b1-41a3-4a46-9a67-50107e8eb466" target="_blank">run this API in Postman</a>
    
    For additional information on how to configure Postman and import a collection, see <a href="https://developer.abnamro.com/docs/postman" target="_blank">Postman</a>.

    ## Step 1 - Get an API key

    1. Register and create an account:
        - Go to <a href="https://developer.abnamro.com/" target="_blank">https://developer.abnamro.com/</a> and click **Sign up**.
        - Enter your details, and click **Create an account**.
        - developer support will send you an activation link by email.
        - Click the activation link.
    2. Create and register an application:
        - Log in to your account.
        - In the top navigation bar, click the **My Apps** icon on the top right.
        - Click on **+ Add app** button.
        - In the **App name** field, enter a name for your application.
        - In the **API product** field, select **Tikkie**, and click **Add app**.
    3. Obtain your API key:
        - In the top navigation bar, click **My Apps**.
        - Click on the app you created.
        - Copy the **API Key** STRING.

    ## Step 2 - Create a sandbox appToken

    >**Important:** In a production environment, App Token is created in the <a href="https://business.tikkie.me" target="_blank">Tikkie Business Portal</a>. The functionality described in this step is available in the sandbox only.

    The functionality described in this step is only available in the sandbox environment.

    To create a new App Token, which already has all permissions enabled (see [App token](#section/Overview/App-token)) on Sandbox, using the API key you obtained in the previous step, execute the following curl command: 
    ```
    curl -X POST "https://api-sandbox.abnamro.com/v2/tikkie/sandboxapps" \
    -H "API-Key: <YOUR_API_KEY>"
    ```
    or see: [POST Sandbox App](#operation/createSandboxApp).

    The response contains an App Token (`appToken`) which should be used in subsequent requests.

    ## Step 3 - Create a payment request

    To create a payment request, using the App Token you created in Step 2, execute: [POST Payment Request](#operation/createPaymentRequest).

    This operation creates a new payment request as specified by the body of the request, and returns a `paymentRequestToken` which is used as unique identifier of a payment request.

    The operation also returns a `url` that is used to direct the user to where the request can be paid. On sandbox environment, this URL goes to the iDEAL simulator where you can simulate a payment. Make sure you have done this before going to the next step.

    ## Step 4 - Retrieve payment request details

    To retrieve details of payment requests, use one of the following operations:

    - [GET Payment Request](#operation/getPaymentRequest): Returns the details of one payment request, specified by a `paymentRequestToken`.

    - [GET Payment Requests](#operation/getPaymentRequestList): Returns a list of payment requests based on the query parameters passed in the request. This list is paginated.

    ## Step 5 - Retrieve payment details

    When a user pays a payment request, the transaction is marked as a 'payment'. This indicates that the payment is completed.

    To retrieve payment details, use one of the following operations:

    - [GET Payment](#operation/getPayment): Returns the details of one payment, specified by a `paymentToken` which is used as unique identifier of one paid payment request.

    - [GET Payments](#operation/getPaymentList): Returns a list of payments based on the query parameters passed in the request. This list is paginated.

    ## Step 6 - Create a refund

    To create a refund, execute: [POST Refund](#operation/createRefund).

    This operation initiates a refund on a specific payment, and returns a `refundToken` which can be used to retrieve details.

    ## Step 7 - Retrieve refund details

    To retrieve refund details, execute: [GET Refund](#operation/getRefund).

    This operation returns the details of one refund, specified by a `refundToken`.

    ## Step 8 - Set up a payment subscription

    To receive notifications when a payment is paid, or when a refund has been paid executed, set up a subscription using: [POST Notification Subscription](#operation/subscribePaymentRequestNotifications).

    HTTP post requests will be made to the specified `url`, containing information about the payment or refund in the body of the request.

    ## Step 9 - Cancel a payment subscription

    To cancel a subscription and stop receiving notifications, execute: [DELETE Notification Subscription](#operation/deletePaymentRequestNotifications).

    ## Step 10 - Retrieve transaction bundle details

    To retrieve details of transactions, use one of the following operations:

    - [GET Transaction Bundle](#operation/getBundle): Returns the details of one transaction bundle specified by a `bundleId`.

    - [GET Transaction Bundles](#operation/getBundleList): Returns a list of transaction bundles based on the query parameters passed in the request. This list is paginated.

    - [Download bundle file](#section/Overview/Payout-of-transactions): Describes how to download a CAMT.053 file of a specific bundle.

    ## Step 11 - Set up a transactions subscription

    To receive notifications when a transactions bundle is paid, set up a subscription using: [POST Transactions Subscription](#operation/subscribeTransactionsNotifications).

    HTTP post requests will be made to the specified `url`, containing information about the transactions bundle in the body of the request.

    ## Step 12 - Cancel a transactions subscription

    To cancel a subscription and stop receiving notifications, execute: [DELETE Transactions Subscription](#operation/deleteTransactionsNotifications).

servers:
  - url: https://api-sandbox.abnamro.com/v2/tikkie
  - url: https://api.abnamro.com/v2/tikkie
tags:
  - name: Payment request
    description: Requests to receive a payment. This API generates a link that is sent to the payer.
  - name: Payment
    description: Payment requests can have one or more payments. These are individual transactions.
  - name: Refund
    description: Payments can use one or more refunds to pay back a customer.
  - name: Payment request notification
    description: Notification subscriptions that inform users when payments on payment requests, or refunds, are completed.
  - name: Sandbox app
    description: An application created in the sandbox environment that is used to experiment and test API operations.
  - name: Transaction bundle
    description: A file containing details of all transactions which occurred during that day.
  - name: Transactions notification
    description: Notification subscriptions to inform users when bundled payout files are available.
paths:
  /paymentrequests:
    post:
      description: |-
        Creates a payment request. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Create a payment request
      operationId: createPaymentRequest
      tags:
        - Payment request
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
      requestBody:
        $ref: "#/components/requestBodies/PaymentRequestCreationRequest"
      responses:
        '201':
          $ref: "#/components/responses/createPaymentRequestSuccess"
        '400':
          $ref: "#/components/responses/InvalidPaymentRequestCreationRequestErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '500':
          $ref: "#/components/responses/ServerErrors"
    get:
      description: |-
        Retrieves a list of payment requests based on the parameters provided. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).
        
        Make sure to add required query parameters to the request, such as `pageNumber` and `pageSize`.
        Example: `/paymentrequests?pageNumber=0&pageSize=10`.

      summary: Retrieves all payment requests
      operationId: getPaymentRequestList
      tags:
        - Payment request
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/pageNumber"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/fromDateTime"
        - $ref: "#/components/parameters/toDateTime"
      responses:
        '200':
          $ref: "#/components/responses/getPaymentRequestListSuccess"
        '400':
          $ref: "#/components/responses/InvalidPaymentRequestListErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /paymentrequestssubscription:
    post:
      description: |-
        Subscribes to payment request related notifications. One payment request subscription can be active at a time. When this request is repeated, the existing payment request subscription is overwritten. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

        >**Note:** The notification system will follow a best-effort approach to deliver notifications. It employs a retry mechanism with a maximum of three attempts. However, you should not rely solely on notifications and are encouraged to have a GET implemented to ensure reliable monitoring.

      summary: Subscribe to notifications
      operationId: subscribePaymentRequestNotifications
      tags:
        - Payment request notification
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscribeRequest"
      responses:
        '201':
          $ref: "#/components/responses/SubscribeSuccess"
        '400':
          $ref: "#/components/responses/InvalidSubscribeRequestErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '500':
          $ref: "#/components/responses/ServerErrors"
      callbacks:
        Notification:
          'notificationUrl':
            post:
              requestBody:
                $ref: "#/components/requestBodies/PaymentRequestNotification"
              responses:
                '2XX':
                  description: "Acknowledgement that a notification is received."
    delete:
      description: |-
        Deletes a subscription. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Delete a subscription
      operationId: deletePaymentRequestNotifications
      tags:
        - Payment request notification
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
      responses:
        '204':
          $ref: "#/components/responses/DeleteSuccess"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /paymentrequests/{paymentRequestToken}:
    get:
      description: |-
        Retrieves a specific payment request based on a token value. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Retrieves details of a specific payment request
      operationId: getPaymentRequest
      tags:
        - Payment request
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/paymentRequestToken"
      responses:
        '200':
          $ref: "#/components/responses/getPaymentRequestSuccess"
        '400':
          $ref: "#/components/responses/InvalidGetPaymentRequestErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '404':
          $ref: "#/components/responses/PaymentRequestNotFoundError"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /paymentrequests/{paymentRequestToken}/payments:
    get:
      description: |-
        Retrieves payments made against a specific payment request based on the parameters provided. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

        Make sure to add required query parameters to the request, such as `pageNumber` and `pageSize`.
        Example: `/paymentrequests/{paymentRequestToken}/payments?pageNumber=0&pageSize=10`.

      summary: Retrieves all payments for a specific payment request
      operationId: getPaymentList
      tags:
        - Payment
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/paymentRequestToken"
        - $ref: "#/components/parameters/pageNumber"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/fromDateTime"
        - $ref: "#/components/parameters/toDateTime"
        - $ref: "#/components/parameters/includeRefunds"
      responses:
        '200':
          $ref: "#/components/responses/getPaymentListSuccess"
        '400':
          $ref: "#/components/responses/InvalidPaymentListErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '404':
          $ref: "#/components/responses/PaymentRequestNotFoundError"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /paymentrequests/{paymentRequestToken}/payments/{paymentToken}:
    get:
      description: |-
        Retrieves details of a specific payment made against a specific payment request based on the value of the tokens. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Retrieves details of a specific payment for a specific payment request
      operationId: getPayment
      tags:
        - Payment
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/paymentRequestToken"
        - $ref: "#/components/parameters/paymentToken"
      responses:
        '200':
          $ref: "#/components/responses/getPaymentSuccess"
        '400':
          $ref: "#/components/responses/InvalidGetPaymentErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '404':
          $ref: "#/components/responses/PaymentNotFoundError"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /paymentrequests/{paymentRequestToken}/payments/{paymentToken}/refunds:
    post:
      description: |-
        Creates a refund for a specific payment. The maximum amount which can be refunded for a payment is the amount paid plus €25.00. The application must have **payment request permission** and the **refund permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Create a refund on a payment
      operationId: createRefund
      tags:
        - Refund
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/paymentRequestToken"
        - $ref: "#/components/parameters/paymentToken"
      requestBody:
        $ref: "#/components/requestBodies/RefundRequest"
      responses:
        '201':
          $ref: "#/components/responses/createRefundSuccess"
        '400':
          $ref: "#/components/responses/InvalidRefundRequestErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/RefundForbiddenErrors"
        '404':
          $ref: "#/components/responses/PaymentNotFoundError"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /paymentrequests/{paymentRequestToken}/payments/{paymentToken}/refunds/{refundToken}:
    get:
      description: |-
        Retrieves details of a specific refund based on a token value. The application must have **payment request permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Retrieves details of a specific refund
      operationId: getRefund
      tags:
        - Refund
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/paymentRequestToken"
        - $ref: "#/components/parameters/paymentToken"
        - $ref: "#/components/parameters/refundToken"
      responses:
        '200':
          $ref: "#/components/responses/getRefundSuccess"
        '400':
          $ref: "#/components/responses/InvalidGetRefundErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/PaymentRequestForbiddenErrors"
        '404':
          $ref: "#/components/responses/RefundNotFoundError"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /sandboxapps:
    post:
      description: Creates an app in the sandbox for you to use with this API. This operation does not work in the production environment.
      summary: Create application in the sandbox
      operationId: createSandboxApp
      tags:
        - Sandbox app
      parameters:
        - $ref: "#/components/parameters/apiKey"
      responses:
        '200':
          $ref: "#/components/responses/createSandboxAppSuccess"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /transactionbundles:
    get:
      description: |-
        Retrieves a list of bundles based on the parameters provided. The application must have **transaction bundle permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

        Make sure to add required query parameters to the request, such as `pageNumber` and `pageSize`.
        Example: `/transactionbundles?pageNumber=0&pageSize=10`.

      summary: Retrieves all bundles
      operationId: getBundleList
      tags:
        - Transaction bundle
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/pageNumber"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/fromDateTime"
        - $ref: "#/components/parameters/toDateTime"
      responses:
        '200':
          $ref: "#/components/responses/getBundleListSuccess"
        '400':
          $ref: "#/components/responses/InvalidBundleListErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/TransactionsForbiddenErrors"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /transactionbundles/{bundleId}:
    get:
      description: |-
        Retrieves a specific bundle based on a bundle identifier. The application must have **transaction bundle permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Retrieves details of a specific bundle
      operationId: getBundle
      tags:
        - Transaction bundle
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
        - $ref: "#/components/parameters/bundleId"
      responses:
        '200':
          $ref: "#/components/responses/getBundleSuccess"
        '400':
          $ref: "#/components/responses/InvalidGetBundleErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/TransactionsForbiddenErrors"
        '404':
          $ref: "#/components/responses/BundleNotFoundError"
        '500':
          $ref: "#/components/responses/ServerErrors"
  /transactionssubscription:
    post:
      description: |-
        Subscribes to transactions related notifications. One transaction subscription can be active at a time. When this request is repeated, the existing transaction subscription is overwritten. The application must have **transaction bundle permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

        >**Note:** The notification system will follow a best-effort approach to deliver notifications. It employs a retry mechanism with a maximum of three attempts. However, you should not rely solely on notifications and are encouraged to have a GET implemented to ensure reliable monitoring.

      summary: Subscribe to notifications
      operationId: subscribeTransactionsNotifications
      tags:
        - Transactions notification
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
      requestBody:
        $ref: "#/components/requestBodies/SubscribeRequest"
      responses:
        '201':
          $ref: "#/components/responses/SubscribeSuccess"
        '400':
          $ref: "#/components/responses/InvalidSubscribeRequestErrors"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/TransactionsForbiddenErrors"
        '500':
          $ref: "#/components/responses/ServerErrors"
      callbacks:
        Notification:
          'notificationUrl':
            post:
              requestBody:
                $ref: "#/components/requestBodies/TransactionsNotification"
              responses:
                '2XX':
                  description: "Acknowledgement that a notification is received."
    delete:
      description: |-
        Deletes a subscription. The application must have **transaction bundle permission** to complete this request.

        For more information, see [App token](#section/Overview/App-token).

      summary: Delete a subscription
      operationId: deleteTransactionsNotifications
      tags:
        - Transactions notification
      parameters:
        - $ref: "#/components/parameters/apiKey"
        - $ref: "#/components/parameters/appToken"
      responses:
        '204':
          $ref: "#/components/responses/DeleteSuccess"
        '401':
          $ref: "#/components/responses/InvalidAccessTokenErrors"
        '403':
          $ref: "#/components/responses/TransactionsForbiddenErrors"
        '500':
          $ref: "#/components/responses/ServerErrors"
components:
##################################### SECURITYSCHEMES #############################
  securitySchemes:
    Api-Key:
      type: apiKey
      in: header
      name: API-Key
      description: "An API-Key is a consumer key that is obtained after app registration on the ABN developer portal."
##################################### REQUESTBODIES ###############################
  requestBodies:
    PaymentRequestCreationRequest:
      description: "The details of the payment request you are creating."
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentRequestCreationRequest"
    RefundRequest:
      description: "The details of the refund request you are creating."
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefundRequest"
    SubscribeRequest:
      description: "The details of the URL you want to receive notifications on per webhook."
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubscribeRequest"
    PaymentRequestNotification:
      description: "The details of the payment request notification."
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentRequestsSubscriptionNotification"
          examples:
            PaymentNotification:
              description: Notification of a payment on a payment request.
              value:
                subscriptionId: 6289db02-d422-4e93-b65c-30fa973bd341
                notificationType: PAYMENT
                paymentRequestToken: "qzdnzr8hnVWTgXXcFRLUMc"
                paymentToken: "21ef7413-cc3c-4c80-9272-6710fada28e4"
            RefundNotification:
              description: Notification of a refund.
              value:
                subscriptionId: 6289db02-d422-4e93-b65c-30fa973bd341
                notificationType: REFUND
                paymentRequestToken: "qzdnzr8hnVWTgXXcFRLUMc"
                paymentToken: "21ef7413-cc3c-4c80-9272-6710fada28e4"
                refundToken: "abcdzr8hnVWTgXXcFRLUMc"
    TransactionsNotification:
      description: "The details of the transactions notification."
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionsSubscriptionNotification"
          examples:
            BundledPayoutNotification:
              description: Notification that a bundled payout occurred.
              value:
                subscriptionId: 5505d055-89e9-48b7-913d-8414d9f8d3cd
                notificationType: BUNDLE
                bundleId: "af8fa035-3275-44fc-9a9b-a38c02efa114"
##################################### RESPONSES ###################################
  responses:
    createPaymentRequestSuccess:
      description: Payment request created.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentRequestCreationResponse"
    getPaymentRequestListSuccess:
      description: A list of payment requests.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            type: object
            properties:
              paymentRequests:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRequest"
                minItems: 0
                maxItems: 50
                description: Payment requests.
              totalElementCount:
                type: integer
                format: "int32"
                description: "Total amount of payment requests that match the parameters provided."
                example: 75
    getPaymentRequestSuccess:
      description: The specific payment request.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentRequest"
    getPaymentListSuccess:
      description: List of payments relating to a payment request.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            type: object
            properties:
              payments:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
                minItems: 0
                maxItems: 50
                description: Payments
              totalElementCount:
                type: integer
                format: "int32"
                description: "Total amount of payments that match the parameters provided."
                example: 75
    SubscribeSuccess:
      description: "Subscription successfully created."
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            type: object
            properties:
              subscriptionId:
                type: string
                format: uuid
                description: "Unique identifier for a subscription. This is sent with the user's payment request notification."
                example: e0111835-e8df-4070-874a-f12cf3f77e39
    DeleteSuccess:
      description: "Subscription successfully removed."
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
    getPaymentSuccess:
      description: Specific payment associated with a payment request.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Payment"
    createRefundSuccess:
      description: Refund request created.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refund"
    getRefundSuccess:
      description: A specific refund.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Refund"
    createSandboxAppSuccess:
      description: Sandbox app created.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SandboxApp"
    getBundleListSuccess:
      description: A list of bundles.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            type: object
            properties:
              bundles:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionBundle"
                minItems: 0
                maxItems: 50
                description: Bundles
              totalElementCount:
                type: integer
                format: "int32"
                description: "Total amount of bundles that match the parameters provided."
                example: 75
    getBundleSuccess:
      description: A specific bundle.
      headers:
        'Trace-Id':
          $ref: "#/components/headers/Trace-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TransactionBundle"
    InvalidPaymentRequestCreationRequestErrors:
      description: |
        Missing or invalid parameters.

        Detailed error list:
          ---
          - DESCRIPTION_MISSING
            > `description` was not supplied in the request.
          - DESCRIPTION_MAX_LENGTH_EXCEEDED
            > `description` exceeds the maximum permitted length.
          - AMOUNT_IN_CENTS_INVALID
            > `amountInCents` is in an invalid format.
          - EXPIRY_DATE_INVALID
            > `expiryDate` is in an invalid format.
          - EXPIRY_DATE_NOT_ALLOWED
            > `expiryDate` is invalid. This date has passed.
          - REFERENCE_ID_INVALID
            > `referenceId` is in an invalid format.
          - PAYMENT_REQUEST_MAX_AMOUNT_EXCEEDED
            > `amountInCents` is above the permitted threshold for this organization.
      headers:
